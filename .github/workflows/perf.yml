name: Perf

# Duel's performance regression guards (see Duel's docs/ci.md), on
# Linux, macOS and Windows, as pg's code paths differ on each. On Linux
# and macOS, Duel's reusable workflow runs them, which this one calls
# with what .duel.rb sets that it needs. Its steps are Unix shell's, so
# the Windows job does the same steps itself, in bash. Each says what it
# found in a report of its own, and the Perf comment workflow comments
# with all three. Each compares a pull request with the branch it
# targets, a merge queue's group with the queue's base, a push with what
# was there before, and on a schedule, the last release (slow creep).
on:
  pull_request:
  merge_group: # (a merge queue's)
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# A pull request's newer push cancels its run, if that's still going, as
# only its newest commit's result counts. Every other run (a push's, say)
# runs to the end, so that each push is compared.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # PostgreSQL, for the server each Duel worker starts (its programs in
  # /usr/lib/postgresql/*/bin, where duel-postgresql looks, with
  # pg_stat_statements), and libpq's headers, to build each version's C
  # extension (c.build in .duel.rb). The Gemfile's optional group has
  # Duel and its PostgreSQL plugin.
  linux:
    uses: sferik/duel-ruby/.github/workflows/duel.yml@v0.2.0
    # (Its Duel job, which runs the branch's code, only reads: the
    # workflow keeps it to contents: read. GitHub checks what each of its
    # jobs asks for against what's granted here, run or not, and those
    # that comment on a pushed commit, mark a push passed or keep a badge,
    # none of which this workflow turns on, ask for contents: write.)
    permissions:
      contents: write
      pull-requests: read # for the pull request's labels (see c.accept_label)
    with:
      report: linux
      ruby-version: "4.0" # the newest Ruby, which those who care most about speed run
      setup: |
        sudo apt-get install -y postgresql libpq-dev
        echo "BUNDLE_WITH=duel" >> "$GITHUB_ENV"
      accept-label: "duel: accept"

  # Homebrew's PostgreSQL, on the PATH (where duel-postgresql looks for
  # its programs, and pg's build for pg_config), which Homebrew doesn't
  # link it onto.
  macos:
    uses: sferik/duel-ruby/.github/workflows/duel.yml@v0.2.0
    permissions:
      contents: write # (as Linux's)
      pull-requests: read
    with:
      report: macos
      runs-on: macos-latest
      ruby-version: "4.0"
      setup: |
        brew install postgresql@17
        echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
        echo "BUNDLE_WITH=duel" >> "$GITHUB_ENV"
      accept-label: "duel: accept"

  # On Windows, what pg's build needs, as source-gem.yml has it:
  # MSYS2's gcc (from Ruby's devkit, so once Ruby is set up) and
  # PostgreSQL's binaries (for libpq), on the PATH. The server each
  # worker starts is the runner's own PostgreSQL's, in PGBIN, whose
  # initdb drops the rights of the runner's user, an administrator, as
  # postgres needs: the binaries' doesn't.
  windows:
    uses: sferik/duel-ruby/.github/workflows/duel.yml@main
    permissions:
      contents: write
      pull-requests: read # for the pull request's labels (see c.accept_label)
    with:
      report: windows
      runs-on: windows-latest
      ruby-version: "4.0"
      setup: |
        echo "BUNDLE_WITH=duel" >> "$GITHUB_ENV"
        echo "DUEL_POSTGRESQL_BIN=$PGBIN" >> "$GITHUB_ENV"
      setup-after-ruby: |
        pacman --sync --needed --noconfirm "${MINGW_PACKAGE_PREFIX}-gcc"
        (cd "$RUNNER_TEMP" && curl -fsSL -o postgresql.zip https://get.enterprisedb.com/postgresql/postgresql-18.0-1-windows-x64-binaries.zip &&
          7z x -y postgresql.zip > /dev/null)
        # (One line, in this order: each line goes before the last, and
        # PostgreSQL's DLLs mustn't come before the devkit's, which gcc runs.)
        echo "$RI_DEVKIT$MINGW_PREFIX/bin;$RI_DEVKIT/usr/bin;$RUNNER_TEMP/pgsql/bin" >> "$GITHUB_PATH"
      accept-label: "duel: accept"
